name: Release

# The version is prepared in a reviewed PR and merged to main before this
# workflow runs. CI builds that exact commit, creates its tag, and publishes
# GitHub Releases as the canonical source before optional registry updates.
#
# GitHub Releases are the canonical source. The same run also prepares package
# manager metadata for Homebrew, WinGet and Scoop, and can publish the thin npm
# adapter through npm trusted publishing when that channel is enabled.
#
# release-scope=all (the default) publishes the macOS app, Tauri Linux/Windows
# installers, cross-platform CLI archives, and the npm launcher. The app uses
# an ad-hoc code signature and is not notarized. Each desktop payload is
# smoke-tested on its own OS before staging: the Linux deb/
# AppImage/rpm and the Windows MSI are extracted, and the bundled Go helper must
# answer with the planned version. The GUI itself is not launched (no display on
# a hosted runner), so this is an installer-payload gate, not a UI test.
# `cli-only` publishes only the CLI archives.
on:
  workflow_dispatch:
    inputs:
      release-scope:
        description: "Desktop platforms to publish"
        required: false
        default: "all"
        type: choice
        options: [cli-only, all]
      publish-npm:
        description: "Publish the thin npm launcher (requires npm trusted publishing)"
        required: false
        default: true
        type: boolean
      publish-homebrew:
        description: "Update the configured external Homebrew tap"
        required: false
        default: true
        type: boolean
      publish-scoop:
        description: "Update the configured external Scoop bucket"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      state: ${{ steps.plan.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a clean main checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain)"

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Validate the merged release version and tag
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SCOPE: ${{ inputs.release-scope }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain)"
          test "$REPOSITORY_VISIBILITY" = public || {
            echo "::error::The repository must be public to publish a public release."
            exit 1
          }
          make check-release
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::VERSION must be a stable x.y.z version."
            exit 1
          }
          grep -Fqx "## ${version}" CHANGELOG.md || {
            echo "::error::CHANGELOG.md must contain a short summary for ${version}."
            exit 1
          }
          tag="v${version}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            sha="$(git rev-list -n 1 "$tag")"
            if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
              if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]]; then
                state=draft
                draft_scope="$(gh release view "$tag" --json body --jq .body | sed -n 's/.*<!-- anypick-release-scope=\([^ ]*\) -->.*/\1/p')"
                draft_asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
                if [[ -z "$draft_scope" && "$draft_asset_count" == 0 ]]; then
                  echo "::notice::Draft has no assets or scope marker; adopting release-scope=${RELEASE_SCOPE}."
                elif [[ "$draft_scope" != "$RELEASE_SCOPE" ]]; then
                  echo "::error::Draft ${tag} was created with release-scope=${draft_scope:-unknown}; resume with that same scope."
                  exit 1
                fi
              else
                state=published
                gh release view "$tag" --json body --jq .body \
                  | bash packaging/release/validate-scope.sh "$RELEASE_SCOPE"
              fi
            else
              state=tagged
            fi
          else
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            if [[ -n "$latest_tag" ]]; then
              latest_version="${latest_tag#v}"
              newest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
              if [[ "$newest" != "$version" || "$latest_version" == "$version" ]]; then
                echo "::error::VERSION ${version} must be newer than the latest release ${latest_tag}. Merge a version update PR first."
                exit 1
              fi
            fi
            sha="$(git rev-parse HEAD)"
            state=new
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "state=${state}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Record the staged SHA
        id: sha
        run: echo "sha=${{ steps.plan.outputs.sha }}" | tee "$GITHUB_OUTPUT"

  # The local Go gates (`make ci`: review, staticcheck and the race suite) run
  # again on the exact commit being released. Platform builds start in
  # parallel, but nothing is tagged, uploaded or published unless this job
  # passes.
  verify:
    name: Gates on the release commit
    needs: plan
    if: needs.plan.outputs.state != 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: make ci
        run: make ci

  build-cli:
    name: Build the cross-platform CLI archives
    needs: plan
    if: needs.plan.outputs.state != 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Verify release version sources
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          make check-release
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"

      - name: Build and archive every supported CLI target
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/anypick-cli"
          work="$RUNNER_TEMP/anypick-cli-work"
          mkdir -p "$stage" "$work"
          for target in \
            darwin-amd64 darwin-arm64 \
            linux-amd64 linux-arm64 \
            windows-amd64 windows-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            executable="anypick"
            archive="anypick-${RELEASE_VERSION}-${target}"
            if [[ "$goos" == windows ]]; then
              executable="anypick.exe"
              archive="$archive.zip"
            else
              archive="$archive.tar.gz"
            fi
            rm -f "$work/anypick" "$work/anypick.exe"
            (
              cd src/go
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "-s -w -X github.com/outof0/anypick/go/internal/buildinfo.Version=${RELEASE_VERSION}" \
                -o "$work/$executable" ./cmd/anypick
            )
            if [[ "$goos" == windows ]]; then
              (cd "$work" && zip -q "$stage/$archive" "$executable")
            else
              tar -C "$work" -czf "$stage/$archive" "$executable"
            fi
          done
          test "$(find "$stage" -maxdepth 1 -type f | wc -l)" -eq 6

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-cli
          path: ${{ runner.temp }}/anypick-cli
          if-no-files-found: error

  build-linux:
    name: Verify and stage the Linux app
    needs: plan
    if: needs.plan.outputs.state != 'published' && inputs.release-scope != 'cli-only'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Select stable Rust with rustfmt
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/app -> src/tauri/app/target
          shared-key: anypick-tauri-release
          cache-on-failure: true

      - name: Verify release version sources
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          make check-release
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"

      # ── verification gate: nothing is staged until this is green ──
      - name: Cross-language check
        run: make check

      - name: Go vet and test
        run: |
          make vet
          make test

      - name: Tauri UI typecheck and bundle build
        run: |
          (cd src/tauri/ui && npm ci)
          make typecheck-tauri-ui
          # The Rust bin embeds frontendDist (../frontend) at compile time, so
          # the bundle must exist before cargo check/test/clippy/build run.
          make build-tauri-ui

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Tauri cargo fmt, test, lints and audit
        run: |
          cargo fmt --manifest-path src/tauri/app/Cargo.toml -- --check
          cargo test --locked --manifest-path src/tauri/app/Cargo.toml
          cargo clippy --locked --manifest-path src/tauri/app/Cargo.toml -- -D warnings
          cargo install cargo-audit --version 0.22.2 --locked
          cd src/tauri/app && cargo audit

      - name: Build the Linux desktop app
        run: make build-tauri

      - name: Stage the Linux bundles
        run: |
          shopt -s nullglob
          assets=(src/tauri/app/target/release/bundle/appimage/*.AppImage
                  src/tauri/app/target/release/bundle/deb/*.deb
                  src/tauri/app/target/release/bundle/rpm/*.rpm)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the Linux desktop app produced no bundle"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/anypick-stage"
          cp "${assets[@]}" "$RUNNER_TEMP/anypick-stage/"

      - name: Smoke-test the staged installer payloads
        run: packaging/smoke/linux-payload.sh "$RUNNER_TEMP/anypick-stage" "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-linux
          path: ${{ runner.temp }}/anypick-stage
          if-no-files-found: error

  build-windows:
    name: Verify and stage the Windows app
    needs: plan
    if: needs.plan.outputs.state != 'published' && inputs.release-scope != 'cli-only'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - name: Select stable Rust with rustfmt
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/app -> src/tauri/app/target
          shared-key: anypick-tauri-release-windows
          cache-on-failure: true

      - name: Verify release version sources
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          make check-release
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"

      - name: Cross-language check
        run: make check

      - name: Tauri UI typecheck and bundle build
        run: |
          (cd src/tauri/ui && npm ci)
          make typecheck-tauri-ui
          # The Rust bin embeds frontendDist (../frontend) at compile time, so
          # the bundle must exist before cargo test/clippy/build run.
          make build-tauri-ui

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Tauri cargo fmt, test, lints and audit
        run: |
          cargo fmt --manifest-path src/tauri/app/Cargo.toml -- --check
          cargo test --locked --manifest-path src/tauri/app/Cargo.toml
          cargo clippy --locked --manifest-path src/tauri/app/Cargo.toml -- -D warnings
          cargo install cargo-audit --version 0.22.2 --locked
          cd src/tauri/app && cargo audit

      - name: Build the Windows desktop app
        run: make build-tauri

      - name: Stage the Windows installers
        run: |
          shopt -s nullglob
          msi_assets=(src/tauri/app/target/release/bundle/msi/*.msi)
          nsis_assets=(src/tauri/app/target/release/bundle/nsis/*.exe)
          assets=("${msi_assets[@]}" "${nsis_assets[@]}")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the Windows desktop app produced no bundle"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/anypick-stage"
          cp "${assets[@]}" "$RUNNER_TEMP/anypick-stage/"
          if [ "${#msi_assets[@]}" -eq 0 ]; then
            echo "::error::the Windows desktop app produced no MSI for WinGet"
            exit 1
          fi
          cp "${msi_assets[0]}" "$RUNNER_TEMP/anypick-stage/AnyPick-${{ needs.plan.outputs.version }}-windows-x64.msi"

      - name: Smoke-test the staged installer payloads
        shell: pwsh
        run: packaging/smoke/windows-payload.ps1 -Stage "${{ runner.temp }}/anypick-stage" -Version "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-windows
          path: ${{ runner.temp }}/anypick-stage
          if-no-files-found: error

  build-macos:
    name: Build and stage the macOS app
    needs: plan
    if: needs.plan.outputs.state != 'published' && inputs.release-scope == 'all'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Verify release version sources
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          make check-release
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"

      - name: Build and apply an ad-hoc code signature
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          src/macos/scripts/release-build.sh --version "$RELEASE_VERSION"

      - name: Verify the bundle has no Node runtime (ADR 0020)
        run: |
          app="$RUNNER_TEMP/anypick-macos-derived/Build/Products/Release/AnyPick.app"
          test -n "$app"
          test -x "$app/Contents/Helpers/anypick-core"
          src/macos/scripts/check-node-free-app.sh "$app"
          (cd src/go && GOPATH="${HOME}/go" GOTOOLCHAIN=auto go run ./cmd/anypick-artifact node-free "$app")
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/AnyPick-macos-universal.zip"
          hdiutil create -volname AnyPick -srcfolder "$app" -ov -format UDZO \
            "$RUNNER_TEMP/AnyPick-macos-universal.dmg"

      - name: Smoke-test the macOS artifact on a clean account
        run: |
          app="$RUNNER_TEMP/anypick-macos-derived/Build/Products/Release/AnyPick.app"
          src/macos/scripts/smoke-installed-artifact.sh "$app" "${{ needs.plan.outputs.version }}"
          src/macos/scripts/smoke-app-service.sh "$app"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-macos
          path: |
            ${{ runner.temp }}/AnyPick-macos-universal.zip
            ${{ runner.temp }}/AnyPick-macos-universal.dmg
          if-no-files-found: error

  publish-release:
    name: Create the canonical GitHub Release
    needs: [plan, verify, build-cli, build-linux, build-windows, build-macos]
    if: >-
      always() && needs.plan.result == 'success' && (
        needs.plan.outputs.state == 'published' || (
          needs.verify.result == 'success' &&
          needs.build-cli.result == 'success' &&
          (inputs.release-scope == 'cli-only' || (needs.build-linux.result == 'success' && needs.build-windows.result == 'success')) &&
          (inputs.release-scope != 'all' || needs.build-macos.result == 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Reuse the already published release without rewriting its assets
        if: needs.plan.outputs.state == 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            extension=tar.gz
            [[ "$target" == windows-* ]] && extension=zip
            asset="anypick-${RELEASE_TAG#v}-${target}.${extension}"
            grep -Fxq "$asset" <<<"$assets" || {
              echo "::error::Published release is missing $asset; refusing to rewrite a public release."
              exit 1
            }
          done
          grep -Fxq SHA256SUMS.txt <<<"$assets"
          grep -Fxq anypick-sbom.spdx.json <<<"$assets"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.state != 'published'
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.state != 'published'
        with:
          name: anypick-cli
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.state != 'published' && inputs.release-scope != 'cli-only'
        with:
          name: anypick-linux
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.state != 'published' && inputs.release-scope != 'cli-only'
        with:
          name: anypick-windows
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.state != 'published' && inputs.release-scope == 'all'
        with:
          name: anypick-macos
          path: ${{ runner.temp }}/anypick-stage

      - name: Render package-manager manifests for manual submission
        if: needs.plan.outputs.state != 'published'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/anypick-stage"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          (cd "$stage" && sha256sum -- *) > "$RUNNER_TEMP/anypick-input-sums.txt"
          mkdir -p "$RUNNER_TEMP/package-manifests/winget" "$RUNNER_TEMP/package-manifests/scoop"
          bash packaging/scoop/render.sh "$RELEASE_VERSION" "$base" \
            "$RUNNER_TEMP/anypick-input-sums.txt" "$RUNNER_TEMP/package-manifests/scoop"
          if [[ -f "$stage/AnyPick-${RELEASE_VERSION}-windows-x64.msi" ]]; then
            bash packaging/winget/render.sh "$RELEASE_VERSION" "$base" \
              "$RUNNER_TEMP/anypick-input-sums.txt" "$RUNNER_TEMP/package-manifests/winget"
          fi
          (cd "$RUNNER_TEMP/package-manifests" && zip -qr "$stage/AnyPick-package-manager-manifests.zip" .)

      - name: Resolve and pin the release tag
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA" || {
              echo "::error::${RELEASE_TAG} points to a different commit; refusing to move a tag."
              exit 1
            }
          else
            git tag --annotate "$RELEASE_TAG" --message "AnyPick ${RELEASE_VERSION}" "$RELEASE_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create a draft with generated release notes
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "::error::Refusing to overwrite a published release."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "AnyPick ${RELEASE_VERSION}" --generate-notes
          fi

      - name: Pin the selected release scope in the draft
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SCOPE: ${{ inputs.release-scope }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$body_file"
          marker="<!-- anypick-release-scope=${RELEASE_SCOPE} -->"
          if ! grep -Fq '<!-- anypick-release-scope=' "$body_file"; then
            printf '\n\n%s\n' "$marker" >> "$body_file"
            gh release edit "$RELEASE_TAG" --notes-file "$body_file"
          else
            grep -Fq "$marker" "$body_file" || {
              echo "::error::Draft release scope differs from this run."
              exit 1
            }
          fi

      - name: Add the release summary from CHANGELOG when present
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          section="$(awk -v ver="$version" '
            $0 == "## " ver { seen = 1; next }
            seen && /^## / { exit }
            seen { print }
          ' CHANGELOG.md)"
          [[ -n "$section" ]] || exit 0
          body_file="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$body_file"
          if ! grep -Fq '## Highlights (from CHANGELOG.md)' "$body_file"; then
            {
              echo ""
              echo "## Highlights (from CHANGELOG.md)"
              echo ""
              printf '%s\n' "$section"
            } >> "$body_file"
            gh release edit "$RELEASE_TAG" --notes-file "$body_file"
          fi

      - name: Generate the release SBOM
        if: needs.plan.outputs.state != 'published'
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          path: ${{ runner.temp }}/anypick-stage
          format: spdx-json
          output-file: ${{ runner.temp }}/anypick-stage/anypick-sbom.spdx.json

      - name: Write checksums for every release asset
        if: needs.plan.outputs.state != 'published'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/anypick-stage"
          (
            cd "$stage"
            for file in *; do
              [[ "$file" == SHA256SUMS.txt ]] || sha256sum -- "$file"
            done
          ) > "$stage/SHA256SUMS.txt"
          test -s "$stage/SHA256SUMS.txt"

      - name: Upload assets to the draft release
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          shopt -s nullglob
          assets=("$RUNNER_TEMP/anypick-stage"/*)
          test "${#assets[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Attest the release artifacts
        if: needs.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/anypick-stage/*

      - name: Publish the GitHub Release after all assets are ready
        if: needs.plan.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publish-npm:
    name: Publish the npm launcher
    needs: [plan, publish-release]
    if: inputs.publish-npm && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.npmjs.com/package/anypick
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - name: Test and publish with npm trusted publishing
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        working-directory: npm/anypick
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          npm test
          mkdir -p "$RUNNER_TEMP/npm-package"
          local_integrity="$(npm pack --json --pack-destination "$RUNNER_TEMP/npm-package" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].integrity))')"
          remote_integrity="$(npm view "anypick@${RELEASE_VERSION}" dist.integrity 2>/dev/null || true)"
          if [[ -n "$remote_integrity" ]]; then
            [[ "$remote_integrity" == "$local_integrity" ]] || {
              echo "::error::npm already has anypick@${RELEASE_VERSION} with different contents."
              exit 1
            }
            echo "npm already contains the identical anypick@${RELEASE_VERSION}; skipping publish."
          else
            npm publish --access public --provenance
          fi

  publish-homebrew:
    name: Update the Homebrew tap
    needs: [plan, publish-release]
    if: inputs.publish-homebrew && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Download release assets and publish the formula and cask
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SCOPE: ${{ inputs.release-scope }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/homebrew-assets"
          mkdir -p "$assets"
          gh release download "$RELEASE_TAG" --dir "$assets" \
            --pattern "anypick-${RELEASE_VERSION}-darwin-*.tar.gz" \
            --pattern "anypick-${RELEASE_VERSION}-linux-*.tar.gz"
          if [[ "$RELEASE_SCOPE" == all ]]; then
            gh release download "$RELEASE_TAG" --dir "$assets" \
              --pattern "AnyPick-macos-universal.zip"
          fi
          (cd "$assets" && sha256sum -- *) > "$RUNNER_TEMP/homebrew-sums.txt"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          packaging/homebrew/publish.sh "$RELEASE_VERSION" "$base" "$RUNNER_TEMP/homebrew-sums.txt"

  publish-scoop:
    name: Update the Scoop CLI bucket
    needs: [plan, publish-release]
    if: inputs.publish-scoop && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Download Windows CLI assets and publish the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/scoop-assets"
          mkdir -p "$assets"
          gh release download "$RELEASE_TAG" --dir "$assets" \
            --pattern "anypick-${RELEASE_VERSION}-windows-*.zip"
          (cd "$assets" && sha256sum -- *) > "$RUNNER_TEMP/scoop-sums.txt"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          packaging/scoop/publish.sh "$RELEASE_VERSION" "$base" "$RUNNER_TEMP/scoop-sums.txt"
