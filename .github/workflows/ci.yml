name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (PR force-push / rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Vet / Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      # Pinned: a new staticcheck release can add checks, and an unpinned
      # `go install ...@latest` would then fail CI for reasons unrelated to the
      # change under review. Bump it deliberately.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Staticcheck
        run: make lint

      # `make check` is the same aggregate the pre-push hook runs, so the two
      # cannot drift: gofmt, vet, and the cross-language gates (repository
      # references, the desktop protocol version Go/Rust/Swift each declare
      # independently, and VERSION against the Xcode MARKETING_VERSION). Cheap,
      # and it fails in seconds on the class of break a directory move
      # introduces. Staticcheck stays separate above: it needs a tool this job
      # installs deliberately.
      - name: Static gates
        run: make check

      # actionlint type-checks every workflow: expressions, `needs:` graphs,
      # job outputs and the shell in `run:` (via shellcheck, preinstalled on
      # ubuntu runners). Pinned like staticcheck above.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Actionlint
        run: actionlint -color

      # `make check` (check-actions) proves every pin has the right shape;
      # only the network can prove the SHA exists upstream. A pin that does
      # not resolve fails release.yml on release day, which is how f60c96f
      # was found. GitHub's API answers 422 or 404 for an unknown commit.
      - name: Action pins resolve upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          # *.y*ml to match the Go gate's glob; *.yaml would be shape-checked
          # offline but silently never network-resolved. The non-empty guard
          # is the AGENTS.md trap: a grep that matches nothing must fail, not
          # read as a passing resolution of zero pins.
          refs=$(grep -hoE 'uses: *[^ ./][^ ]*@[0-9a-f]{40}' .github/workflows/*.y*ml | sed -E 's/uses: *//' | sort -u)
          if [ -z "$refs" ]; then
            echo "::error::no pinned action found under .github/workflows — the resolver matched nothing, which proves nothing"
            exit 1
          fi
          while read -r ref; do
            repo=$(printf '%s' "${ref%@*}" | cut -d/ -f1-2)
            sha=${ref#*@}
            if ! gh api "repos/$repo/commits/$sha" --jq .sha >/dev/null 2>&1; then
              echo "::error::$ref does not resolve to a commit in $repo"
              fail=1
            fi
          done <<< "$refs"
          exit "$fail"

  go:
    name: Go / Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum
      - name: Vet
        working-directory: src/go
        run: go vet ./...
      - name: Test
        working-directory: src/go
        run: |
          # GitHub runs bash with -e, which aborts on the failing pipeline
          # before the grep below can report anything.
          set +e
          go test ./... -count=1 2>&1 | tee /tmp/go-test.log
          rc=${PIPESTATUS[0]}
          echo "::group::failing tests"
          grep -E -- '--- FAIL|^FAIL|panic:' /tmp/go-test.log | head -40 | sed 's/^/::error:: /'
          echo "::endgroup::"
          exit "$rc"

      - name: Race test
        working-directory: src/go
        run: go test -race ./... -count=1


  linux-cli-headless:
    name: Go / Linux CLI headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum
      - name: Build static linux amd64 CLI
        working-directory: src/go
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/anypick-linux-amd64 ./cmd/anypick
      - name: Headless smoke (QA A–C)
        run: packaging/smoke/linux-cli-headless.sh src/go/bin/anypick-linux-amd64

  go-windows:
    name: Go / Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum
      - name: Test native Windows process, lock, proxy, and CLI paths
        working-directory: src/go
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee /tmp/go-test.log
          rc=${PIPESTATUS[0]}
          echo "::group::failing tests"
          grep -E -- '--- FAIL|^FAIL|panic:' /tmp/go-test.log | head -40 | sed 's/^/::error:: /'
          echo "::endgroup::"
          exit "$rc"

  tauri:
    name: Tauri app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - name: Install Linux web dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf webkit2gtk-driver xvfb xauth dbus-x11

      - name: Select stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/app -> src/tauri/app/target
          shared-key: anypick-tauri-ci

      # ADR 0020 ships this app on Linux and Windows, so it needs a gate. The
      # Go sidecar path in build.rs is exactly the kind of assumption that a
      # directory move breaks silently.
      - name: Cross-language check
        run: make check-paths check-protocol

      - name: Install UI dependencies
        run: cd src/tauri/ui && npm ci

      - name: Typecheck the UI
        run: make typecheck-tauri-ui

      # The macOS feature map. It is a report today rather than a gate,
      # because 71 rows are still `todo`, but it fails if the map drifts from
      # either source tree, which is what would let it go stale.
      - name: macOS to Tauri feature parity
        run: make check-parity

      - name: Build the UI bundle
        run: make build-tauri-ui

      - name: Test the UI
        run: make test-tauri-ui

      - name: cargo check the app and its Go sidecar
        run: cd src/tauri/app && cargo check --locked

      - name: Rust format check
        run: cargo fmt --manifest-path src/tauri/app/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src/tauri/app/Cargo.toml

      - name: Rust lints
        run: cargo clippy --locked --manifest-path src/tauri/app/Cargo.toml -- -D warnings

      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cd src/tauri/app && cargo audit

      - name: Install native WebDriver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build the real Linux desktop executable
        if: runner.os == 'Linux'
        run: cargo build --locked --manifest-path src/tauri/app/Cargo.toml

      - name: Build the real Windows desktop executable with test-only WebDriver
        if: runner.os == 'Windows'
        run: cargo build --locked --features e2e-webdriver --manifest-path src/tauri/app/Cargo.toml

      - name: Native desktop E2E (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a dbus-run-session -- node src/tauri/ui/scripts/desktop-e2e.mjs

      - name: Native desktop E2E (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node src/tauri/ui/scripts/desktop-e2e.mjs

  macos-app:
    name: macOS app / Xcode & universal helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum
      - name: Unit-test app and bundled helper contract
        run: >-
          xcodebuild -project src/macos/AnyPick.xcodeproj -scheme AnyPick
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO test
      - name: Smoke-test the app-owned bundled service
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/AnyPick.app' -print -quit)"
          test -n "$app"
          src/macos/scripts/smoke-app-service.sh "$app"
      - name: Build unsigned universal structure
        run: >-
          xcodebuild -project src/macos/AnyPick.xcodeproj -scheme AnyPick
          -configuration Release -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify both app and helper architectures
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/AnyPick.app' -print -quit)"
          test -n "$app"
          test -x "$app/Contents/Helpers/anypick-core"
          case "$(lipo -archs "$app/Contents/MacOS/AnyPick")" in
            'x86_64 arm64'|'arm64 x86_64') ;;
            *) exit 1 ;;
          esac
          case "$(lipo -archs "$app/Contents/Helpers/anypick-core")" in
            'x86_64 arm64'|'arm64 x86_64') ;;
            *) exit 1 ;;
          esac
          src/macos/scripts/check-node-free-app.sh "$app"

  # PR feedback remains non-blocking. The `all` release path runs this same
  # lifecycle/UI suite as a blocking step in `build-macos` before publishing.
  macos-ui:
    name: macOS app / UI tests (non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum
      - name: Allow UI automation without a prompt
        run: |
          sudo DevToolsSecurity -enable
          sudo automationmodetool enable-automationmode-without-authentication
      - name: XCUITest flows
        run: make test-macos-ui
      - name: Keep the test results when it fails
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: macos-ui-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: ignore

  docs:
    name: Docs / Typecheck / Lint / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Typecheck docs
        run: cd docs && pnpm typecheck

      - name: Lint docs
        run: cd docs && pnpm lint:docs

      - name: Build docs
        run: cd docs && pnpm build

      - name: Check landing SEO and download links
        run: cd docs && pnpm check:landing

      - name: Validate Cloudflare Pages configuration
        run: cd docs && pnpm exec wrangler types "${RUNNER_TEMP}/anypick-pages-env.d.ts"

  distribution:
    name: Distribution adapters / npm and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - name: Check the thin npm launcher
        run: |
          cd npm/anypick
          npm test
          npm pack --dry-run

      - name: Check package-manager generators
        run: |
          bash -n packaging/homebrew/render.sh packaging/homebrew/render-cask.sh packaging/homebrew/publish.sh
          bash -n packaging/winget/render.sh
          bash -n packaging/scoop/render.sh packaging/scoop/publish.sh
          bash -n packaging/release/validate-scope.sh packaging/release/validate-scope_test.sh
          bash packaging/release/validate-scope_test.sh

      - name: Check the release payload smoke scripts
        run: |
          bash -n packaging/smoke/linux-payload.sh packaging/smoke/linux-cli-headless.sh
          bash packaging/smoke/linux-payload_test.sh
          node --check src/tauri/ui/scripts/desktop-e2e.mjs
          # shellcheck disable=SC2016 # $null is PowerShell, not shell; the quotes are deliberate.
          pwsh -NoProfile -Command 'foreach ($path in @("packaging/smoke/windows-payload.ps1")) { $errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors); if ($errors.Count) { throw ($errors | Out-String) } }'
