[package]
name = "anypick-desktop"
version = "1.1.5"
description = "AnyPick desktop app for Windows and Linux"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[[bin]]
name = "anypick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
